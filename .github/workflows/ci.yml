name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Typecheck do Nuxt; não falha o pipeline se não houver tipos perfeitos
      - run: npx nuxi typecheck
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run test:coverage || true
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e || true
      - name: Upload cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
      - name: Upload cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Se o projeto for SSR, "npm run build" cria .output/
      # Se for SSG, considere trocar por "npm run generate".
      - name: Build Nuxt
        run: |
          npm run build
          echo "== Listando possíveis saídas =="
          ls -la || true
          ls -la .output || true
          ls -la .output/public || true
          ls -la dist || true
        env:
          NODE_ENV: production

      # Upload condicional — cobre SSR (.output), SSG (.output/public) e fallback dist/
      - name: Upload .output (SSR)
        if: ${{ hashFiles('.output/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-ssr
          path: .output
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload .output/public (SSG)
        if: ${{ hashFiles('.output/public/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-ssg
          path: .output/public
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload dist (fallback)
        if: ${{ hashFiles('dist/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-dist
          path: dist
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate || true

  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      # Baixa todos os artefatos que existirem e mescla em um diretório único
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: |
          echo "Conteúdo baixado:"
          find artifacts -maxdepth 2 -type d -print
          node -v

      # Comentário no PR (placeholder; ajuste mensagem/URL do preview real)
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview build disponível! Artefatos foram gerados e anexados ao workflow.'
            })
