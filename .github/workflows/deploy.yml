name: Deploy Produção

on:
  push:
    branches: [master]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hotelbooking.com
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Para SSR, "build" -> .output; para SSG, troque por "generate"
      - name: Build para produção
        run: npm run build
        env:
          NODE_ENV: production
          NUXT_PUBLIC_BASE_URL: https://hotelbooking.com

      # 👉 Coloque aqui seu passo real de deploy (FTP, SSH, rsync, Vercel CLI, etc.)
      # Exemplo fictício:
      # - name: Deploy via rsync
      #   run: rsync -az --delete .output/ user@server:/var/www/site

      # Cria release automaticamente quando o push vier de uma tag v*
      - name: Criar Release a partir da tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: '🚀 Nova versão em produção!',
              draft: false,
              prerelease: false
            })

      - run: echo "✅ Deploy realizado com sucesso!"
        if: success()
      - run: echo "❌ Deploy falhou!"
        if: failure()
